name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/CODEOWNERS"
      - "LICENSE"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/CODEOWNERS"
      - "LICENSE"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-that-is-long-enough-for-tests
      TOKEN_DIGEST_SECRET: ci-token-digest-secret-for-tests
      AUTH_CONFIG_ENCRYPTION_KEY: ci-auth-config-encryption-key-for-tests
      SMTP_ENABLED: "false"
      PASSWORD_RESET_TOKEN_MINUTES: "45"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment
        run: npm run validate:config

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke tests
        env:
          DATABASE_URL: file:./playwright.db
          NEXTAUTH_URL: http://127.0.0.1:3000
          PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXTAUTH_SECRET: ci-playwright-nextauth-secret
          TOKEN_DIGEST_SECRET: ci-playwright-token-digest-secret
          AUTH_CONFIG_ENCRYPTION_KEY: ci-playwright-auth-config-key
          SMTP_ENABLED: "false"
          TEST_OAUTH_PROVIDER_ENABLED: "true"
        run: npm run test:e2e:ci

      - name: Enabled receipt browser tests
        run: npm run test:e2e:receipts

      - name: Production server smoke and SEO tests
        run: npm run test:e2e:production
