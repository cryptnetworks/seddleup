name: Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-entrypoint.sh"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "proxy.ts"
      - "public/**"
      - "scripts/**"
      - "types/**"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-entrypoint.sh"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "proxy.ts"
      - "public/**"
      - "scripts/**"
      - "types/**"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/seddleup

jobs:
  docker:
    name: docker (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: linux-amd64
            manifest: true
          - platform: linux/arm64/v8
            artifact: linux-arm64-v8
            manifest: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: Export image digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.artifact }}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.artifact }}
          path: /tmp/digests/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload manifest digest
        if: github.event_name != 'pull_request' && matrix.manifest
        uses: actions/upload-artifact@v7
        with:
          name: digest-manifest-${{ matrix.artifact }}
          path: /tmp/digests/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - docker

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-manifest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Create multi-platform manifest
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail

          refs=()
          for digest_file in /tmp/digests/*; do
            digest="$(cat "$digest_file")"
            refs+=("${IMAGE_NAME}@${digest}")
          done

          tags=()
          while IFS= read -r tag; do
            tags+=("-t" "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
