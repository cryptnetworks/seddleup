name: Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-entrypoint.sh"
      - ".env.docker.example"
      - "cloudflare/**"
      - "nginx/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "proxy.ts"
      - "public/**"
      - "scripts/**"
      - "types/**"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-entrypoint.sh"
      - ".env.docker.example"
      - "cloudflare/**"
      - "nginx/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "proxy.ts"
      - "public/**"
      - "scripts/**"
      - "types/**"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/seddleup

jobs:
  docker:
    name: docker (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: linux-amd64
            manifest: true
            trusted_runner: '["self-hosted","linux","x64"]'
            hosted_runner: '"ubuntu-latest"'
            qemu: false
          - platform: linux/arm64/v8
            artifact: linux-arm64-v8
            manifest: true
            trusted_runner: '"ubuntu-24.04-arm"'
            hosted_runner: '"ubuntu-24.04-arm"'
            qemu: false

    # Only the amd64 entry can select the self-hosted runner. ARM64 remains native.
    runs-on: ${{ fromJSON(vars.USE_SELF_HOSTED_X64 == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.trusted_runner || matrix.hosted_runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify trusted self-hosted source
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Refusing to run fork pull-request code on a self-hosted runner."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Verify Docker
        run: docker version

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker Buildx
        run: docker buildx version

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}
          provenance: false

      - name: Build and push image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}
          provenance: false

      - name: Export image digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${RUNNER_TEMP}/digests/${{ matrix.artifact }}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload manifest digest
        if: github.event_name != 'pull_request' && matrix.manifest
        uses: actions/upload-artifact@v7
        with:
          name: digest-manifest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

      - name: Clean generated workspace files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP}/digests"

          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          fi

  runtime-probes:
    name: Docker runtime and migration probes
    # Fork pull requests and the operator fallback stay on GitHub-hosted runners.
    runs-on: ${{ fromJSON(vars.USE_SELF_HOSTED_X64 == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64"]' || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      PROBE_IMAGE: seddleup:ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Verify trusted self-hosted source
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Refusing to run fork pull-request code on a self-hosted runner."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Verify Docker
        run: docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker Buildx
        run: docker buildx version

      - name: Build probe image
        run: docker build -t "${PROBE_IMAGE}" .

      - name: Run runtime probes
        run: bash scripts/probe-docker-runtime.sh "${PROBE_IMAGE}"

      - name: Run optional profile probes
        run: bash scripts/probe-docker-profiles.sh "${PROBE_IMAGE}"

      - name: Clean probe image and workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker image rm -f "${PROBE_IMAGE}" >/dev/null 2>&1 || true

          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          fi

  publish-security:
    if: github.event_name != 'pull_request'
    name: Publish security validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit locked dependencies
        run: npm run security:audit

      - name: Build image for scanning
        run: docker build -t seddleup:publish-security .

      - name: Scan publish image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: seddleup:publish-security
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker-manifest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - docker
      - runtime-probes
      - publish-security
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-manifest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Create multi-platform manifest
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail

          refs=()
          for digest_file in "${RUNNER_TEMP}"/digests/*; do
            digest="$(cat "$digest_file")"
            refs+=("${IMAGE_NAME}@${digest}")
          done

          tags=()
          while IFS= read -r tag; do
            tags+=("-t" "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
